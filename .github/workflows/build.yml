name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Compiler l'APK
        run: gradle assembleRelease --stacktrace
      - name: Renommer
        run: cp app/build/outputs/apk/release/app-release.apk Reves.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Reves-apk
          path: Reves.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Rêves 1.0.${{ github.run_number }}
          files: Reves.apk
          make_latest: true
